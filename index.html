<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanEvo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="logo" href="#accueil">PlanEvo</a>
  <nav>
    <a href="#accueil">Accueil</a>
    <a href="#algues">Algues</a>
    <a href="#mousses">Mousses</a>
    <a href="#fougeres">Fougère</a>
    <a href="#coniferes">Conifère</a>
    <a href="#graminees">Graminées</a>
    <a href="#dicotyledones">Dicotylédones</a>
  </nav>
</header>

<!-- grid-area: ligne / colonne -->

<section id="accueil">
  <div class="grid">
    <a class="card" href="#algues"></a>
    <a class="card" href="#mousses"></a>
    <a class="card" href="#fougeres"></a>
    <a class="card" href="#coniferes"></a>
    <a class="card" href="#graminees"></a>
    <a class="card" href="#dicotyledones"></a>
  </div>
</section>

<section id="algues">
  <div class="grid">
    <div class="card" style="grid-area: 1 / 1"></div>
    <div class="card" style="grid-area: 1 / 3"></div>
    <div class="card" style="grid-area: 3 / 1"></div>
  </div>
  <a class="retour" href="#accueil">Retour à l'accueil</a>
</section>

<section id="mousses">
  <div class="grid">
    <div class="card" style="grid-area: 1 / 1"></div>
    <div class="card" style="grid-area: 2 / 2"></div>
    <div class="card" style="grid-area: 3 / 3"></div>
  </div>
  <a class="retour" href="#accueil">Retour à l'accueil</a>
</section>

<section id="fougeres">
  <div class="grid">
    <div class="card" style="grid-area: 1 / 1"></div>
    <div class="card" style="grid-area: 1 / 3"></div>
    <div class="card" style="grid-area: 2 / 2"></div>
  </div>
  <a class="retour" href="#accueil">Retour à l'accueil</a>
</section>

<section id="coniferes">
  <div class="grid">
    <div class="card" style="grid-area: 1 / 3"></div>
    <div class="card" style="grid-area: 2 / 2"></div>
    <div class="card" style="grid-area: 3 / 1"></div>
  </div>
  <a class="retour" href="#accueil">Retour à l'accueil</a>
</section>

<section id="graminees">
  <div class="grid">
    <div class="card" style="grid-area: 1 / 1"></div>
    <div class="card" style="grid-area: 1 / 3"></div>
    <div class="card" style="grid-area: 3 / 3"></div>
  </div>
  <a class="retour gauche" href="#accueil">Retour à l'accueil</a>
</section>

<section id="dicotyledones">
  <div class="grid">
    <div class="card" style="grid-area: 1 / 1"></div>
    <div class="card" style="grid-area: 2 / 1"></div>
    <div class="card" style="grid-area: 1 / 3"></div>
  </div>
  <a class="retour" href="#accueil">Retour à l'accueil</a>
</section>

</body>
</html>
